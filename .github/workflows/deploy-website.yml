# Builds apps/website and publishes it to GitHub Pages:
#   https://johnny-quesada-developer.github.io/easy-cancelable-promise/
#
# The site runs against the BUILT package (libs/easy-cancelable-promise/dist), so every Nx target used here
# builds the library first. A site that deploys is also a check that the published files work.
#
# This workflow only deploys the website. Publishing the npm package is a separate, manual process
# (yarn publish:pkg) and is never triggered from here.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'libs/easy-cancelable-promise/src/**'
      - 'libs/easy-cancelable-promise/package.json'
      - 'libs/easy-cancelable-promise/esbuild.config.ts'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  NX_NO_CLOUD: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: yarn nx run website:lint

      - name: Test
        run: yarn nx run website:test

      - name: Type-check
        run: yarn nx run website:ts-check

      - name: Build
        run: yarn nx run website:build

      - name: Check internal links
        run: yarn nx run website:check:links

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
